name: CI

on:
  push:
    branches:
      - main
      - ray-tracing-enhancement

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update
            sudo apt-get install -y build-essential cmake libglm-dev libpng-dev \
              libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev
          else
            brew install cmake glm libpng
          fi

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -- -j3

      - name: Correctness tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke render
        run: |
          ./build/Raytracer --scene cornell_water_scene.xml --width 64 --samples 4 \
            --no-denoise --quiet --out build/smoke.png --pfm build/smoke.pfm
          test -s build/smoke.png && test -s build/smoke.pfm

      - name: Measurement pipeline smoke test
        run: |
          S=benchmarks/scenes/cornell_box.xml
          ./build/Raytracer --scene $S --width 32 --progressive --samples 256 --seed 1000003 \
            --no-denoise --quiet --out build/ref.png --pfm build/ref.pfm --variance-out build/ref_var.pfm
          ./build/Raytracer --scene $S --width 32 --time-budget 1 --seed 1 --reference build/ref.pfm \
            --ref-variance build/ref_var.pfm --log build/log.csv --no-denoise --quiet \
            --out build/test.png --pfm build/test.pfm
          ./build/rt_compare build/test.pfm build/ref.pfm --ref-variance build/ref_var.pfm --json
          grep -q '^cornell_box,mis,' build/log.csv

      - name: Generated scenes are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 benchmarks/make_scenes.py
          git diff --exit-code benchmarks/scenes

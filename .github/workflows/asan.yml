name: ASAN

on:
  push:
    branches: [ main, ray-tracing-enhancement ]
  pull_request:
    branches: [ main ]

jobs:
  asan-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libglm-dev libpng-dev

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: |
            build
            ~/.cache/ccache
          key: ${{ runner.os }}-asan-v2-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-asan-v2-

      - name: Configure (ASAN + UBSAN)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DRAYTRACER_BUILD_GUI=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build -- -j2

      - name: Correctness tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

      - name: Run (ASAN smoke render)
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ./build/Raytracer --scene cornell_water_scene.xml --width 32 --samples 2 --no-denoise --quiet --out build/smoke.png
